[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "semantic-git"
version = "0.1.0"
description = "Validate commit messages against the semantic (conventional) format."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = []

[project.scripts]
semantic-git = "semantic_git.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
